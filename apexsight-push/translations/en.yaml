configuration:
  admin_username:
    name: Admin username
    description: Username for the relay web GUI (OPEN WEB UI) login.
  admin_password:
    name: Admin password
    description: >-
      Password for the web GUI login. Pick a long one — it protects the page
      where you upload your Apple APNs key.
  pairing_code:
    name: Pairing code
    description: >-
      Pre-filled with the shared household code. Leave as-is for a shared-camera
      setup; it must match the code shown in the app (Settings → Instant Push).
  frigate_base_url:
    name: Frigate URL (for the snapshot)
    description: >-
      A URL your phone can reach Frigate at, used to load the notification
      image/GIF — e.g. https://frigate.yourdomain.com. Leave blank for text-only.
  frigate_api_url:
    name: Frigate LAN API URL (optional)
    description: >-
      Where the add-on itself reads Frigate's API (event best frames, AI review
      stories, the recordings probe) — never sent to phones. Leave blank to use
      http://<frigate_rtsp_host>:5000; set it only if Frigate's unauthenticated
      API is somewhere else, e.g. http://192.168.1.204:5001.
  alerts_only:
    name: Alerts only
    description: On = only Frigate "alert" reviews. Off = also send detections.
  topic:
    name: MQTT topic
    description: Frigate review topic. Leave as frigate/reviews unless you changed it.
  doorbell_lead_ms:
    name: Doorbell warm-up lead (ms)
    description: >-
      Silence played to the doorbell speaker BEFORE your words so it's fully awake
      — the Aqara opens its speaker a beat after the talk session starts. Raise it
      if the FIRST word is still clipped; lower it if there's too much dead air.
      Default 800.
  doorbell_tail_ms:
    name: Doorbell drain tail (ms)
    description: >-
      Silence played AFTER your words so the speaker finishes the last one before
      the session closes. Raise it if the END is clipped. Default 500.
  doorbell_drain_ms:
    name: Doorbell close pause (ms)
    description: >-
      Extra pause before hanging up the talk session, so the speaker buffer fully
      empties. Default 300.
  doorbell_ring_debounce:
    name: Doorbell ring debounce (seconds)
    description: >-
      A visitor mashing the doorbell rings your phones ONCE — re-presses within this many
      seconds are ignored, so the call doesn't keep restarting. 0 disables. Default 30.
  mqtt_host:
    name: MQTT host (optional)
    description: Leave blank to use the Home Assistant broker automatically.
  mqtt_port:
    name: MQTT port (optional)
    description: Leave 0 to use the Home Assistant broker automatically.
  mqtt_user:
    name: MQTT username (optional)
    description: Leave blank to use the Home Assistant broker automatically.
  mqtt_password:
    name: MQTT password (optional)
    description: Leave blank to use the Home Assistant broker automatically.
  smart_package_alerts:
    name: Package pickup alerts
    description: >-
      After a package has rested at the door, push when it is picked up — naming a
      recognised person, or a time-sensitive "Someone took the package" otherwise.
  package_confirm_seconds:
    name: Package pickup confirm (seconds)
    description: >-
      How long the spot must stay empty, after everyone has left, before a pickup is
      announced. Frigate drops a still box's track when someone stands in front of it,
      so too short a wait sends false pickups. Default 120.
  package_min_dwell_seconds:
    name: Package resting time (seconds)
    description: >-
      A package must be seen resting this long before it is watched (a box being carried
      is not a delivery). Default 30; 10 right after a carrier visit.
  package_image_check:
    name: Package image check
    description: >-
      Before announcing a pickup, compare the package's spot in the camera's current frame
      with the package's own snapshot, and stay quiet if it still looks like the package.
  smart_vehicle_alerts:
    name: Vehicle arrival / departure alerts
    description: >-
      Track the known vehicles in Frigate's LPR known_plates (home or away) and push when
      one arrives home or leaves. Also feeds the app's Vehicles row.
  vehicle_cameras:
    name: Vehicle cameras
    description: Comma-separated cameras that watch the driveway.
  vehicle_home_zones:
    name: Vehicle home zones
    description: Comma-separated zones that count as "parked at home".
  vehicle_depart_confirm_seconds:
    name: Departure confirm (seconds)
    description: >-
      A departure is announced only if the vehicle isn't seen parked again within this
      many seconds (a turn in the street is not leaving). Default 60.
  smart_linger_alerts:
    name: Lingering alerts
    description: >-
      Time-sensitive push when an unknown person or car stays in an alert zone too long.
      Once per visitor.
  linger_person_seconds:
    name: Lingering person threshold (seconds)
    description: Default 90.
  linger_car_seconds:
    name: Lingering car threshold (seconds)
    description: Default 300.
  linger_zones:
    name: Lingering zones
    description: >-
      Comma-separated camera:zone pairs to watch; camera:* means anywhere on that camera
      (for a camera with no zones), and an optional :person or :car limits an entry. The
      driveway watches cars only by default (residents there are rarely face-matched) — add
      Front_Driveway:driveway:person for people. Side_Gate is off by default (its long
      "person" tracks were the dog and yard things); add Side_Gate:* to watch it.
