name: ApexSight Push
version: "1.31.0"
slug: apexsight_push
description: All-in-one APNs relay (web GUI) + Frigate alert bridge for instant iOS notifications.
url: https://github.com/btoth525/apexsight-ha-addon/tree/main/apexsight-push
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
# Lets the add-on call HA's TTS (tts_get_url) so `apexsight/doorbell/say` can speak text at the door.
homeassistant_api: true
# Pulls MQTT connection details automatically from the Home Assistant broker.
services:
  - mqtt:need
# Publishes the relay so your Cloudflare Tunnel / proxy can reach it.
ports:
  "3421/tcp": 3421
ports_description:
  "3421/tcp": Relay API + web GUI — point your Cloudflare Tunnel / proxy at this host port
# "OPEN WEB UI" button → the admin page on the mapped host port.
webui: "http://[HOST]:[PORT:3421]/admin"
options:
  admin_username: admin
  admin_password: ""
  pairing_code: ""
  legacy_pairing_codes: ""
  webhook_cop_lights: ""
  webhook_siren: ""
  webhook_voice: ""
  webhook_lights_siren: ""
  webhook_deterrent: ""
  frigate_base_url: ""
  frigate_rtsp_host: ""
  use_frigate_profiles: true
  alerts_only: true
  topic: "frigate/reviews"
  doorbell_ip: ""
  doorbell_gain: "3.0"
  doorbell_tts_engine: "tts.piper"
  doorbell_lead_ms: 800
  doorbell_tail_ms: 500
  doorbell_drain_ms: 300
  doorbell_ring_debounce: 30
  mqtt_host: ""
  mqtt_port: 0
  mqtt_user: ""
  mqtt_password: ""
  turn_key_id: ""
  turn_api_token: ""
  smart_package_alerts: true
  package_confirm_seconds: 120
  package_min_dwell_seconds: 30
  package_image_check: true
  smart_vehicle_alerts: true
  vehicle_cameras: "Front_Driveway,Front_Driveway_LPR"
  vehicle_home_zones: "driveway"
  vehicle_depart_confirm_seconds: 60
  smart_linger_alerts: true
  linger_person_seconds: 90
  linger_car_seconds: 300
  linger_zones: "doorbell:side_walk,doorbell:porch,Front_Driveway:driveway:car"
schema:
  admin_username: str
  admin_password: password
  pairing_code: "match(^(APEX-[A-Z0-9]{4}-[A-Z0-9]{4})?$)"
  legacy_pairing_codes: str?
  webhook_cop_lights: password?
  webhook_siren: password?
  webhook_voice: password?
  webhook_lights_siren: password?
  webhook_deterrent: password?
  frigate_base_url: url?
  frigate_rtsp_host: str?
  frigate_api_url: str?
  use_frigate_profiles: bool?
  alerts_only: bool
  topic: str
  doorbell_ip: str?
  doorbell_gain: str?
  doorbell_tts_engine: str?
  doorbell_lead_ms: int(0,5000)?
  doorbell_tail_ms: int(0,5000)?
  doorbell_drain_ms: int(0,3000)?
  doorbell_ring_debounce: int(0,120)?
  mqtt_host: str?
  mqtt_port: int?
  mqtt_user: str?
  mqtt_password: password?
  turn_key_id: str?
  turn_api_token: password?
  smart_package_alerts: bool?
  package_confirm_seconds: int(60,3600)?
  package_min_dwell_seconds: int(5,600)?
  package_image_check: bool?
  smart_vehicle_alerts: bool?
  vehicle_cameras: str?
  vehicle_home_zones: str?
  vehicle_depart_confirm_seconds: int(0,1800)?
  smart_linger_alerts: bool?
  linger_person_seconds: int(15,3600)?
  linger_car_seconds: int(30,7200)?
  linger_zones: str?
